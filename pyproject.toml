[project]
name = "fin-enclave"
version = "0.1.0"
description = "Air-Gapped Financial Forensic & Anti-Money Laundering Graph Workstation on ASUS Ascent GX10"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Adrien Skrzypczak", email = "adrien.skrzyp@gmail.com" }
]
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.30.0",
    "rich>=13.7.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
